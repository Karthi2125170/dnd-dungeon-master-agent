<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eldoria | Medieval Fantasy D&D Dungeon Master</title>

<!-- Google Fonts: Cinzel (Fantasy Titles) & Outfit (Modern Body Text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<style>
  :root {
    --bg-dark: #090d16;
    --panel-bg: rgba(21, 28, 44, 0.85);
    --panel-border: rgba(147, 51, 234, 0.3);
    --accent-purple: #9333ea;
    --accent-gold: #f59e0b;
    --accent-gold-glow: rgba(245, 158, 11, 0.4);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --user-bubble: linear-gradient(135deg, #7e22ce, #9333ea);
    --agent-bubble: rgba(30, 41, 59, 0.9);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    background: radial-gradient(circle at top center, #1e112a 0%, #090d16 100%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Top Navigation Header --- */
  header {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    padding: 0.9rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    font-size: 2.2rem;
    filter: drop-shadow(0 0 8px var(--accent-gold-glow));
  }

  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, #fef08a, #f59e0b, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .badge {
    background: rgba(147, 51, 234, 0.2);
    border: 1px solid rgba(147, 51, 234, 0.4);
    color: #e9d5ff;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* --- Main Chat Log Container --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar {
    width: 6px;
  }
  #log::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 4px;
  }

  /* --- Dialogue Chat Bubbles --- */
  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.3s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .speaker-label {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent-gold);
    margin-bottom: 0.3rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .msg.user .speaker-label {
    color: #c084fc;
  }

  .bubble {
    display: inline-block;
    padding: 0.9rem 1.25rem;
    border-radius: 16px;
    background: var(--agent-bubble);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    max-width: 85%;
    line-height: 1.6;
    font-size: 0.98rem;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* --- Quick Action Prompt Chips --- */
  .quick-prompts-container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem 0.6rem 1.5rem;
  }

  .quick-prompts-title {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }

  .prompts-row {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding-bottom: 0.3rem;
  }

  .prompt-chip {
    background: rgba(30, 41, 59, 0.75);
    border: 1px solid var(--panel-border);
    color: #e2e8f0;
    padding: 0.5rem 0.85rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .prompt-chip:hover {
    background: rgba(147, 51, 234, 0.3);
    border-color: var(--accent-gold);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
  }

  /* --- Bottom Input Control Bar --- */
  form-container {
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--panel-border);
    padding: 0.8rem 1.5rem 1.2rem 1.5rem;
  }

  form {
    display: flex;
    gap: 0.75rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    font-size: 0.98rem;
    font-family: inherit;
    background: rgba(9, 13, 22, 0.8);
    color: var(--text-primary);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--accent-gold);
    box-shadow: 0 0 12px var(--accent-gold-glow);
  }

  button {
    padding: 0.85rem 1.6rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #0f172a;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button:hover {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
  }

  /* --- A2UI Card Styling Extensions --- */
  .a2card {
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 16px;
    padding: 1.25rem;
    background: radial-gradient(circle at top left, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; }
  .a2text.a2-h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #fef08a; border-bottom: 1px solid var(--panel-border); padding-bottom: 0.4rem; }
  .a2text.a2-h2 { font-family: 'Cinzel', serif; font-size: 1.25rem; font-weight: 700; color: #f59e0b; }
  .a2text.a2-h3 { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600; color: #e9d5ff; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #cbd5e1; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  
  .a2divider { border: none; border-top: 1px solid rgba(147, 51, 234, 0.25); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; border: 1px solid var(--accent-gold); display: block; margin-top: 0.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent-gold); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-icon">🐉</span>
    <div class="brand-title">Eldoria: D&D Dungeon Master</div>
  </div>
  <div class="badge">Vertex AI ADK • A2UI v0.8</div>
</header>

<div id="log"></div>

<div class="quick-prompts-container">
  <div class="quick-prompts-title">✨ Quick Actions / Example Prompts</div>
  <div class="prompts-row">
    <button class="prompt-chip" onclick="sendPrompt('My character is Eldrin, a Male High Elf Wizard. Sexuality: Straight. Stats: Str 10, Dex 14, Con 12, Int 18, Wis 12, Cha 9. Backstory: Studied star magic.')">
      🧙‍♂️ Create Hero: Eldrin (Elf Wizard)
    </button>
    <button class="prompt-chip" onclick="sendPrompt('Roll 1d20 + 4 for Intelligence perception check against DC 15')">
      🎲 Roll Perception Check (DC 15)
    </button>
    <button class="prompt-chip" onclick="sendPrompt('Lookup 5e rules for the Fireball spell')">
      📜 Lookup 5e Spell: Fireball
    </button>
  </div>
</div>

<form-container>
  <form id="form">
    <input id="input" placeholder="Speak your action to the Dungeon Master…" autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#0f172a;">send</span>
    </button>
  </form>
</form-container>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  
  const label = el("div", "speaker-label");
  if (who === "user") {
    label.innerHTML = `<span>You</span> <span class="material-symbols-outlined" style="font-size:0.9rem; color:#c084fc;">person</span>`;
  } else {
    label.innerHTML = `<span class="material-symbols-outlined" style="font-size:0.9rem;">auto_awesome</span> <span>Dungeon Master</span>`;
  }
  m.appendChild(label);

  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

// Welcome message on load
window.addEventListener("DOMContentLoaded", () => {
  const b = bubble("agent");
  b.textContent = "Greetings, traveler! Welcome to the mystical realm of Eldoria. I am your Dungeon Master. Speak your champion's name or choose a quick action below to begin your quest!";
});
</script>
</body>
</html>
